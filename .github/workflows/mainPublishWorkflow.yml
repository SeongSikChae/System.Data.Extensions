name: Main Publish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore System.Data.Extensions/System.Data.Extensions.csproj

    - name: Pack
      run: dotnet pack System.Data.Extensions/System.Data.Extensions.csproj -c Release --no-restore -o ./artifacts

    - name: Get Project Version
      uses: bbonkr/get-version-action@v1
      id: project_version
      with:
        project: "./System.Data.Extensions/System.Data.Extensions.csproj"

    - name: Create Git Tag
      run: |
        TAG_NAME=v${{ steps.project_version.outputs.version }}
        git tag $TAG_NAME -d || true
        git tag $TAG_NAME
        git push origin --delete $TAG_NAME || true
        git push origin $TAG_NAME
        echo "tag_name=$TAG_NAME" >> $GITHUB_ENV
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete existing release
      run: |
        TAG_NAME=${{ env.tag_name }}
        gh release delete $TAG_NAME -y || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
        tag_name: ${{ env.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
